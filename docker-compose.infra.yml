# tupu 工程基础设施栈 (v5 重构所需)
#
# 三大服务：
#   1. Authentik    -- 面向 Agent 的 SSO/RBAC 控制面（Keycloak 替代品，Python 写）
#   2. Qdrant       -- 业务向量库（替换 MySQL JSON 列 + 内存手算余弦）
#   3. Neo4j        -- 强 schema 业务图存储（L0-L4 七层结构 + L2X/L4X 实体）
#
# Authentik 自带依赖：PostgreSQL 16 + Redis 7（仅供 Authentik，不与 tupu 业务库冲突）
#
# 启动：
#   cd tupu
#   docker compose -f docker-compose.infra.yml up -d
#
# 端口约定（避免与 tupu 现有 3000/8000/3306 冲突）：
#   Authentik HTTP   : 9100   (9000 经常被其它服务占用)
#   Authentik HTTPS  : 9143
#   Qdrant REST      : 6333
#   Qdrant gRPC      : 6334
#   Neo4j HTTP UI    : 7474
#   Neo4j Bolt       : 7687
#   tupu PG          : 5432   (实体业务数据迁 PG，physical_table 预览走这里)
#   tupu MySQL       : 3306   (主数据/配置库)
#   tupu ES          : 11200  (复用 docker-es01-1，PS 索引 + 量测数据)

x-authentik-env: &authentik-env
  AUTHENTIK_REDIS__HOST: authentik_redis
  AUTHENTIK_POSTGRESQL__HOST: authentik_postgres
  AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_PG_USER:-authentik}
  AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_PG_DB:-authentik}
  AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASSWORD:?set in .env.infra}
  AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-tupu_change_me_authentik_secret}
  AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
  AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
  AUTHENTIK_LOG_LEVEL: ${AUTHENTIK_LOG_LEVEL:-info}
  # Bootstrap：首次启动自动创建 akadmin 超管 + API Token，便于脚本化配置
  AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:?set in .env.infra}
  AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-tupu_bootstrap_token_change_me_xxxxxxxxxxxxxxxxxx}
  AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@tupu.local}

services:
  # --------------------------------------------------------------------- #
  # Authentik 依赖：Postgres + Redis (内置网络，不暴露到宿主)
  # --------------------------------------------------------------------- #
  authentik_postgres:
    image: postgres:16-alpine
    container_name: tupu_authentik_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTHENTIK_PG_USER:-authentik}
      POSTGRES_DB: ${AUTHENTIK_PG_DB:-authentik}
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASSWORD:?set in .env.infra}
    volumes:
      - authentik_pg_data:/var/lib/postgresql/data
    networks:
      - tupu_infra
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${AUTHENTIK_PG_USER:-authentik} -d ${AUTHENTIK_PG_DB:-authentik}
      interval: 10s
      timeout: 5s
      retries: 6

  authentik_redis:
    image: redis:7-alpine
    container_name: tupu_authentik_redis
    restart: unless-stopped
    command: --save 60 1 --loglevel warning
    volumes:
      - authentik_redis_data:/data
    networks:
      - tupu_infra
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 6

  # --------------------------------------------------------------------- #
  # Authentik 主服务：server (HTTP/HTTPS) + worker (后台任务)
  # --------------------------------------------------------------------- #
  authentik_server:
    image: ghcr.io/goauthentik/server:2024.10
    container_name: tupu_authentik_server
    restart: unless-stopped
    command: server
    environment:
      <<: *authentik-env
    ports:
      - "${AUTHENTIK_PORT_HTTP:-9100}:9000"
      - "${AUTHENTIK_PORT_HTTPS:-9143}:9443"
    depends_on:
      authentik_postgres:
        condition: service_healthy
      authentik_redis:
        condition: service_healthy
    networks:
      - tupu_infra

  authentik_worker:
    image: ghcr.io/goauthentik/server:2024.10
    container_name: tupu_authentik_worker
    restart: unless-stopped
    command: worker
    environment:
      <<: *authentik-env
    depends_on:
      authentik_postgres:
        condition: service_healthy
      authentik_redis:
        condition: service_healthy
    networks:
      - tupu_infra

  # --------------------------------------------------------------------- #
  # Qdrant 向量库 (替代当前 MySQL JSON 列 + 内存手算余弦)
  # --------------------------------------------------------------------- #
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: tupu_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT_REST:-6333}:6333"
      - "${QDRANT_PORT_GRPC:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set in .env.infra}
    networks:
      - tupu_infra

  # --------------------------------------------------------------------- #
  # Neo4j (强 schema 业务图：L0-L4 + L2X/L4X)
  # --------------------------------------------------------------------- #
  neo4j:
    image: neo4j:5.24-community
    container_name: tupu_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?set in .env.infra (neo4j/PASSWORD)}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "${NEO4J_PORT_HTTP:-7474}:7474"
      - "${NEO4J_PORT_BOLT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    networks:
      - tupu_infra
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -u neo4j -p ${NEO4J_PASSWORD:?set in .env.infra} 'RETURN 1' || exit 1
      interval: 15s
      timeout: 10s
      retries: 6

  # --------------------------------------------------------------------- #
  # tupu 业务 MySQL (主数据/配置库，tupu backend 主库)
  # - 独立栈，端口 3306
  # --------------------------------------------------------------------- #
  tupu_mysql:
    image: mysql:8.0.39
    container_name: tupu_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${TUPU_MYSQL_PASSWORD:?set in .env.infra}
      MYSQL_DATABASE: ${TUPU_MYSQL_DB:-tupu}
    command:
      --max_connections=1000
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "${TUPU_MYSQL_PORT:-3306}:3306"
    volumes:
      - tupu_mysql_data:/var/lib/mysql
    networks:
      - tupu_infra
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${TUPU_MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 6

  # --------------------------------------------------------------------- #
  # tupu 业务 PostgreSQL (实体业务数据迁 PG，physical_table 预览走这里)
  # - 与 Authentik 的 PG 隔离：Authentik 用内部 authentik_postgres（不暴露宿主）
  # - 本服务暴露 25432 供 tupu backend 直连（避开 Hyper-V 保留端口范围 5341-5440）
  # --------------------------------------------------------------------- #
  tupu_pg:
    image: postgres:16-alpine
    container_name: tupu_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TUPU_PG_USER:-postgres}
      POSTGRES_DB: ${TUPU_PG_DB:-tupu}
      POSTGRES_PASSWORD: ${TUPU_PG_PASSWORD:-postgres}
    ports:
      - "${TUPU_PG_PORT:-25432}:5432"
    volumes:
      - tupu_pg_data:/var/lib/postgresql/data
    networks:
      - tupu_infra
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${TUPU_PG_USER:-postgres} -d ${TUPU_PG_DB:-tupu}
      interval: 10s
      timeout: 5s
      retries: 6

  # --------------------------------------------------------------------- #
  # SuperTokens Core（权限体系重构 T3，design §4.1）——身份层单容器
  # - 数据落 tupu_pg 的 supertokens 库（Core 首次启动自动建表）
  # - 宿主端口 13567（≥10000 端口纪律，AGENTS.md 端口表已登记）
  # - 镜像定版禁 latest（🛠R10：registry.supertokens.io 为官方现行源，
  #   Docker Hub 同名镜像已停更）；tag 于 T3 执行时经 docker pull 确认写死
  # - API_KEYS 走 .env.infra 的 SUPERTOKENS_API_KEY（密钥纪律 design §8.2）
  # --------------------------------------------------------------------- #
  tupu_supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:9.3.0
    container_name: tupu_supertokens
    restart: unless-stopped
    depends_on:
      tupu_pg:
        condition: service_healthy
    environment:
      # 实施实测（T3）：9.3.0 镜像不解析 POSTGRESQL_CONNECTION_URI（连接池始终
      # 落 localhost 默认致启动失败）——用显式分项变量（官方等价配置面）。
      POSTGRESQL_HOST: tupu_pg
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_USER: ${TUPU_PG_USER:-postgres}
      POSTGRESQL_PASSWORD: ${TUPU_PG_PASSWORD:-postgres}
      POSTGRESQL_DATABASE_NAME: supertokens
      API_KEYS: "${SUPERTOKENS_API_KEY:?set in .env.infra}"
    ports:
      - "${SUPERTOKENS_PORT:-13567}:3567"
    networks:
      - tupu_infra
    healthcheck:
      test: ["CMD", "bash", "-c", "wget -qO- http://localhost:3567/hello || curl -sf http://localhost:3567/hello"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  tupu_infra:
    name: tupu_infra
    driver: bridge

volumes:
  authentik_pg_data:
    name: tupu_authentik_pg_data
  authentik_redis_data:
    name: tupu_authentik_redis_data
  qdrant_data:
    name: tupu_qdrant_data
  neo4j_data:
    name: tupu_neo4j_data
  neo4j_logs:
    name: tupu_neo4j_logs
  neo4j_plugins:
    name: tupu_neo4j_plugins
  tupu_mysql_data:
    name: tupu_mysql_data
  tupu_pg_data:
    name: tupu_pg_data
