[pytest]
# R3: 全量测试超时保护--单测 30s 超时，integration 标记的测试 120s 超时
# 防止依赖外部服务的测试卡住导致全量回归无法完成
timeout = 30
timeout_method = thread

# 默认排除 integration 测试（依赖后端服务运行），需手动 -m integration 运行
addopts = -m "not integration"

# 自定义 marker
markers =
    integration: 依赖外部服务（MySQL/ES/Qdrant/Neo4j/LLM/后端API）的集成测试，需更长超时

# 默认收集路径
testpaths = tests
